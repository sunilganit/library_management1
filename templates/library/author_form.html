{% extends 'base.html' %}
{% block title %}Add Author · Athenaeum{% endblock %}
{% block header %}Add Author ✍️{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card card-modern"><div class="card-body p-4">
<h4 class="fw-bold mb-1">New Author</h4><p class="text-muted small mb-3">Add a writer to the catalog.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<div class="d-flex gap-2 mt-3"><button class="btn btn-primary flex-grow-1"><i class="bi bi-check-lg me-1"></i> Save Author</button><a href="{% url 'author_list' %}" class="btn btn-light border">Cancel</a></div></form>
</div></div></div></div>
{% endblock %}
