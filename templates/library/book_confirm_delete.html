{% extends 'base.html' %}

{% block content %}

<div class="card">

<div class="card-body">

<h3>Delete Book?</h3>

<p>
Are you sure you want to delete
<strong>{{ book.title }}</strong>?
</p>

<form method="post">

{% csrf_token %}

<button class="btn btn-danger">
    Yes, Delete
</button>

<a
    href="{% url 'book_list' %}"
    class="btn btn-secondary">
    Cancel
</a>

</form>

</div>

</div>

{% endblock %}
