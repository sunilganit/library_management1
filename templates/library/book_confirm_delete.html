{% extends 'base.html' %}
{% block title %}Delete Book · Athenaeum{% endblock %}
{% block header %}Delete Book 🗑️{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
<div class="card card-modern border-danger-subtle"><div class="card-body p-4 text-center">
<span class="d-inline-grid mb-3 rounded-circle bg-danger-subtle text-danger" style="width:64px;height:64px;place-items:center;font-size:1.6rem;display:inline-grid"><i class="bi bi-trash3-fill"></i></span>
<h4 class="fw-bold">Delete this book?</h4>
<p class="text-muted">Are you sure you want to permanently delete <strong class="text-dark">"{{ book.title }}"</strong>? This cannot be undone.</p>
<form method="post">{% csrf_token %}<div class="d-flex gap-2 justify-content-center"><button class="btn btn-danger"><i class="bi bi-trash me-1"></i> Yes, Delete</button><a href="{% url 'book_list' %}" class="btn btn-light border">Cancel</a></div></form>
</div></div>
</div></div>
{% endblock %}
