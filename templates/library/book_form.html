{% extends 'base.html' %}

{% block content %}

<h2>
    {% if book %}
        ✏️ Edit Book
    {% else %}
        ➕ Add Book
    {% endif %}
</h2>


<form method="post" class="mt-4">

    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn btn-primary">
        Save
    </button>

    <a
        href="{% url 'book_list' %}"
        class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
