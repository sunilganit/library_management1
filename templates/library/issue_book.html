{% extends 'base.html' %}

{% block content %}

<h2>📖 Issue Book</h2>

<form method="post">

{% csrf_token %}


<div class="mb-3">

<label class="form-label">
    Select Book
</label>

<select
    name="book"
    class="form-select"
    required>

<option value="">
    Select Book
</option>

{% for book in books %}

<option value="{{ book.id }}">

{{ book.title }}
-
Available: {{ book.available_quantity }}

</option>

{% endfor %}

</select>

</div>


<div class="mb-3">

<label class="form-label">
    Select Member
</label>

<select
    name="member"
    class="form-select"
    required>

<option value="">
    Select Member
</option>

{% for member in members %}

<option value="{{ member.id }}">

{{ member.user.get_full_name|default:member.user.username }}

</option>

{% endfor %}

</select>

</div>


<div class="alert alert-info">

<strong>Loan period:</strong>
14 days

</div>


<button class="btn btn-success">
    Issue Book
</button>

<a
    href="{% url 'issue_list' %}"
    class="btn btn-secondary">
    Cancel
</a>

</form>

{% endblock %}
